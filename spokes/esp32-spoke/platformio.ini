; ── PlatformIO project for ESP32-C6 reSpeaker XVF3800 spoke ────────
[env:esp32c6]
platform = espressif32
board = esp32-c6-devkitc-1
framework = espidf
monitor_speed = 115200
build_flags =
    -DCONFIG_ESP32C6_SUPPORTED
    -DCONFIG_WIFI_STATIC_RX_BUFFER_NUM=16
    -DCONFIG_WIFI_MGMT_SBUF_NUM=32
    -DCONFIG_SPIRAM
    -Os
    -DMQTT_MSG_ERROR_TYPE=1
lib_deps =
    bblanchon/ArduinoJson@^7.0.0
    https://github.com/nopnop2002/esp32-tcp-client
