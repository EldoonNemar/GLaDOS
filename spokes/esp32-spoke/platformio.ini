[env:xiao_esp32s3]
platform = espressif32
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -DCONFIG_WIFI_SSID=\"1.21Jigowatts\"
    -DCONFIG_WIFI_PASSWORD=\"Jigowatts\"
    -DCONFIG_HUB_HOST=\"192.168.1.58\"
    -DCONFIG_HUB_PORT=5051
    ; USB-Serial-JTAG console: Serial (and panic backtraces) come out the
    ; XIAO's USB-C, so bring-up is debuggable over /dev/ttyACM0
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; B111: 8 MB OCTAL PSRAM (the XIAO S3 has it; the IDE build left it
    ; disabled, which is why the TTS burst exhausted the 50 KB heap).
    ; Mirrors the IDE's Tools > PSRAM > OPI PSRAM selection exactly.
    -DBOARD_HAS_PSRAM
board_build.psram_type = opi
